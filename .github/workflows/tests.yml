name: tests

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - run: python -m pip install -e ".[test]"
      - run: pytest -q
